# Unsloth QLoRA 파인튜닝 설정
job_name: "test_run_gemma3_12b_v1"

model:
  name_or_path: "google/gemma-3-12b-it"
  load_in_4bit: true
  trust_remote_code: true

dataset:
  path: "./data/sample_dataset.jsonl"
  text_column: "text"

training:
  # LoRA 어댑터와 학습 체크포인트 저장 경로
  output_dir: "./outputs/test_run_gemma3_12b_v1"

  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  max_seq_length: 2048
  packing: false

  learning_rate: 2.0e-4
  num_train_epochs: 3
  logging_steps: 10
  warmup_ratio: 0.03
  lr_scheduler_type: "linear"
  optim: "adamw_8bit"
  seed: 3407

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  use_gradient_checkpointing: "unsloth"
  use_rslora: false

  save_strategy: "epoch"
  save_total_limit: 2
  report_to: "none"
